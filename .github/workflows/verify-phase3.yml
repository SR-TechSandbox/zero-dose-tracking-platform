name: Verify Phase 3 Full Stack (SPA + Microservices)

on:
  push:
    branches: ["main", "feat/*"]
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Typecheck & build React SPA
        working-directory: frontend
        run: |
          npm install
          npm run build

  e2e-full-stack-phase3:
    needs: frontend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env & TLS certs
        run: |
          cp .env.example .env
          chmod +x infra/postgres/init-databases.sh infra/nginx/generate-certs.sh
          ./infra/nginx/generate-certs.sh

      - name: Boot full 8-container stack
        run: docker compose --profile full up -d --build

      - name: Wait for Keycloak & Services to be Ready
        run: |
          READY=0
          for i in $(seq 1 50); do
            CODE=$(curl -sk -o /dev/null -w "%{http_code}" https://localhost/auth/realms/zero-dose-realm/protocol/openid-connect/certs || true)
            if [ "$CODE" -eq 200 ]; then
              echo "Keycloak is ready (attempt $i)."
              READY=1
              break
            fi
            sleep 3
          done
          docker compose --profile full ps
          docker stats --no-stream
          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Keycloak did not become ready within 150s (last HTTP code: $CODE)"
            exit 1
          fi

      - name: Verify SPA served via Nginx Edge LB
        run: |
          set -e
          HTML=$(curl -sk -f https://localhost/)
          echo "$HTML" | grep -q '<div id="root"></div>'
          echo "React SPA index.html served cleanly over HTTPS."

      - name: Verify API Gateway & Auth Regression
        run: |
          set -e
          CODE=$(curl -sk -o /dev/null -w "%{http_code}" https://localhost/api/v1/campaigns)
          test "$CODE" -eq 401

          ADMIN_TOKEN=$(curl -sk -X POST https://localhost/auth/realms/zero-dose-realm/protocol/openid-connect/token \
            -d "client_id=zd-cli-test" -d "username=admin.user" -d "password=AdminPass123!" -d "grant_type=password" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")

          curl -sk -f https://localhost/api/v1/analytics/summary \
            -H "Authorization: Bearer $ADMIN_TOKEN" | grep -q "total_campaigns"
          echo "Phase 3 API regression passed."

      - name: Verify live baseline seeding & event-replay transitions
        run: |
          set -euo pipefail

          ADMIN_TOKEN=$(curl -sk -X POST https://localhost/auth/realms/zero-dose-realm/protocol/openid-connect/token \
            -d "client_id=zd-cli-test" -d "username=admin.user" -d "password=AdminPass123!" -d "grant_type=password" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")

          echo "Checking /api/v1/analytics/transitions..."
          curl -skf -H "Authorization: Bearer $ADMIN_TOKEN" \
            "https://localhost/api/v1/analytics/transitions" > /tmp/transitions.json
          python3 - <<'EOF'
          import json
          with open("/tmp/transitions.json") as f:
              data = json.load(f)
          assert data["total_children"] == 60, f"Expected 60 children, got {data['total_children']}"
          assert data["total_encounters"] == 130, f"Expected 130 encounters, got {data['total_encounters']}"
          assert data["rounds"] == ["R1", "R2", "R3"], f"Unexpected rounds: {data['rounds']}"
          r1_r2 = data["transitions"][0]
          ids = {c["child_id"] for c in r1_r2["transitioned_children"]}
          assert "C016" in ids, "C016 (external vaccination) should transition in R1->R2"
          assert "C043" not in ids, "C043 (intra-round correction) must not transition in R1->R2"
          assert "C027" not in ids, "C027 (intra-round duplicate) must not transition in R1->R2"
          print("Live transitions check passed:", r1_r2["from_round"], "->", r1_r2["to_round"], "count=", r1_r2["transitioned_count"])
          EOF

          echo "Checking /api/v1/analytics/children/C043/timeline..."
          curl -skf -H "Authorization: Bearer $ADMIN_TOKEN" \
            "https://localhost/api/v1/analytics/children/C043/timeline" > /tmp/c043.json
          python3 - <<'EOF'
          import json
          with open("/tmp/c043.json") as f:
              tl = json.load(f)
          assert tl["round_states"]["R1"]["zero_dose"] is True
          assert tl["round_states"]["R2"]["zero_dose"] is True
          r2_ids = [e["event_id"] for e in tl["audit_trail"] if e["round_id"] == "R2"]
          assert r2_ids == ["E0070", "E0094"], f"Unexpected R2 audit trail: {r2_ids}"
          print("Live C043 correction timeline check passed.")
          EOF

          echo "Checking /api/v1/analytics/children/C016/timeline..."
          curl -skf -H "Authorization: Bearer $ADMIN_TOKEN" \
            "https://localhost/api/v1/analytics/children/C016/timeline" > /tmp/c016.json
          python3 - <<'EOF'
          import json
          with open("/tmp/c016.json") as f:
              tl = json.load(f)
          assert tl["round_states"]["R2"]["zero_dose"] is False
          assert tl["round_states"]["R2"]["confirmation_method"] == "External (Vaccinated Elsewhere)"
          print("Live C016 external vaccination check passed.")
          EOF

      - name: Dump Logs on Failure
        if: failure()
        run: docker compose --profile full logs --tail=50