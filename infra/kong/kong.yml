_format_version: "3.0"
_transform: true

services:
  - name: campaign-service
    url: http://campaign-service:8001
    routes:
      - name: campaign-routes
        paths:
          - /api/v1/campaigns
          - /api/v1/rounds
        strip_path: false

  - name: tracking-service
    url: http://tracking-service:8002
    routes:
      - name: tracking-routes
        paths:
          - /api/v1/beneficiaries
          - /api/v1/vaccinations
          - /api/v1/encounters
        strip_path: false

  - name: analytics-service
    url: http://analytics-service:8003
    routes:
      - name: analytics-routes
        paths:
          - /api/v1/analytics
          - /api/v1/metrics
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - https://localhost
        - http://localhost:5173
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
      exposed_headers:
        - X-RateLimit-Limit-Minute
        - X-RateLimit-Remaining-Minute
      credentials: true
      max_age: 3600

  - name: rate-limiting
    config:
      minute: 100
      policy: local