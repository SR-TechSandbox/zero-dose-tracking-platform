services:
  postgres:
    image: postgres:18-alpine
    container_name: zd-postgres
    profiles: ["core", "auth", "full"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CAMPAIGN_DB_NAME: ${CAMPAIGN_DB_NAME}
      CAMPAIGN_DB_USER: ${CAMPAIGN_DB_USER}
      CAMPAIGN_DB_PASSWORD: ${CAMPAIGN_DB_PASSWORD}
      TRACKING_DB_NAME: ${TRACKING_DB_NAME}
      TRACKING_DB_USER: ${TRACKING_DB_USER}
      TRACKING_DB_PASSWORD: ${TRACKING_DB_PASSWORD}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=100"]
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks:
      - data-net
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: zd-keycloak
    profiles: ["auth", "full"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://zd-postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - edge-net
      - app-net
      - data-net
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kong:
    image: kong:3.8
    container_name: zd-kong
    profiles: ["auth", "full"]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_LOG_LEVEL: ${KONG_LOG_LEVEL:-warn}
      KONG_NGINX_WORKER_PROCESSES: 1
      KONG_MEM_CACHE_SIZE: 64m
    ports:
      - "8000:8000"
    volumes:
      - ./infra/kong/kong.yml:/etc/kong/kong.yml:ro
    networks:
      - edge-net
      - app-net
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: zd-nginx
    profiles: ["core", "auth", "full"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    networks:
      - edge-net
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  campaign-service:
    build:
      context: .
      dockerfile: services/campaign-service/Dockerfile
    container_name: zd-campaign-service
    profiles: ["full"]
    environment:
      DATABASE_URL: postgresql+psycopg://${CAMPAIGN_DB_USER}:${CAMPAIGN_DB_PASSWORD}@zd-postgres:5432/${CAMPAIGN_DB_NAME}
      JWKS_URL: ${JWKS_URL}
      JWT_ISSUER: ${JWT_ISSUER}
    networks:
      - app-net
      - data-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tracking-service:
    build:
      context: .
      dockerfile: services/tracking-service/Dockerfile
    container_name: zd-tracking-service
    profiles: ["full"]
    environment:
      DATABASE_URL: postgresql+psycopg://${TRACKING_DB_USER}:${TRACKING_DB_PASSWORD}@zd-postgres:5432/${TRACKING_DB_NAME}
      JWKS_URL: ${JWKS_URL}
      JWT_ISSUER: ${JWT_ISSUER}
    networks:
      - app-net
      - data-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    container_name: zd-analytics-service
    profiles: ["full"]
    environment:
      CAMPAIGN_SERVICE_URL: http://campaign-service:8001
      TRACKING_SERVICE_URL: http://tracking-service:8002
      JWKS_URL: ${JWKS_URL}
      JWT_ISSUER: ${JWT_ISSUER}
    networks:
      - app-net
    depends_on:
      campaign-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  edge-net:
    driver: bridge
  app-net:
    driver: bridge
  data-net:
    driver: bridge

volumes:
  pg_data: